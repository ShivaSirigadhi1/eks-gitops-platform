# Default values for blueprint-app

replicaCount: 2

image:
  repository: ghcr.io/your-org/blueprint-app
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8080
  metricsPort: 9090

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: blueprint.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

livenessProbe:
  path: /healthz
  initialDelaySeconds: 10
  periodSeconds: 15
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  path: /readyz
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 2

startupProbe:
  path: /healthz
  initialDelaySeconds: 3
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 12

serviceAccount:
  create: true
  name: app
  annotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  privileged: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9090"
  prometheus.io/path: "/metrics"

serviceMonitor:
  enabled: true
  interval: 30s

canary:
  enabled: false
  weight: 10
  steps:
    - weight: 10
      pause:
        duration: 30s
    - weight: 30
      pause:
        duration: 30s
    - weight: 50
      pause:
        duration: 30s
    - weight: 100

env:
  SERVICE_NAME: blueprint-app
  LOG_LEVEL: info
  LOG_FORMAT: json
  ENVIRONMENT: production
  ENABLE_SWAGGER: "false"
  OTEL_TRACES_SAMPLER_ARG: "0.2"

secrets:
  existingSecret: ""
  data: {}
