apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "blueprint-app.fullname" . }}-config
  labels:
    {{- include "blueprint-app.labels" . | nindent 4 }}
data:
  SERVICE_NAME: {{ .Values.env.SERVICE_NAME | quote }}
  SERVER_PORT: "8080"
  METRICS_PORT: "9090"
  LOG_LEVEL: {{ .Values.env.LOG_LEVEL | quote }}
  LOG_FORMAT: {{ .Values.env.LOG_FORMAT | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.observability.svc:4318"
  OTEL_TRACES_SAMPLER_ARG: {{ .Values.env.OTEL_TRACES_SAMPLER_ARG | quote }}
