{{- if .Values.canary.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "blueprint-app.fullname" . }}
  labels:
    {{- include "blueprint-app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "blueprint-app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "blueprint-app.selectorLabels" . | nindent 8 }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ include "blueprint-app.name" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "blueprint-app.fullname" . }}-config
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          livenessProbe:
            httpGet:
              path: {{ .Values.livenessProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.readinessProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
  strategy:
    canary:
      analysis:
        templates:
          - templateName: canary-analysis
        args:
          - name: service-name
            value: {{ include "blueprint-app.fullname" . }}
          - name: namespace
            value: {{ .Release.Namespace }}
      steps:
        {{- range .Values.canary.steps }}
        - setWeight: {{ .weight }}
          {{- if .pause }}
          pause:
            duration: {{ .pause.duration }}
          {{- end }}
        {{- end }}
{{- end }}
