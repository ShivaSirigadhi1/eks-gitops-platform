{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "blueprint-app.fullname" . }}
  labels:
    {{- include "blueprint-app.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "blueprint-app.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: metrics
      interval: {{ .Values.serviceMonitor.interval }}
      path: /metrics
{{- end }}
