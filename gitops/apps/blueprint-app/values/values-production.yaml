# Production environment values - updated by CI/CD (manual PR)
replicaCount: 3
image:
  repository: ghcr.io/your-org/blueprint-app
  tag: "stable"
  pullPolicy: IfNotPresent
ingress:
  enabled: true
  className: alb
  hosts:
    - host: example.com
      paths:
        - path: /
          pathType: Prefix
env:
  ENVIRONMENT: production
  LOG_LEVEL: warn
  ENABLE_SWAGGER: "false"
  OTEL_TRACES_SAMPLER_ARG: "0.1"
resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
canary:
  enabled: true
  weight: 10
  steps:
    - weight: 10
      pause:
        duration: 30s
    - weight: 30
      pause:
        duration: 30s
    - weight: 50
      pause:
        duration: 30s
    - weight: 100
