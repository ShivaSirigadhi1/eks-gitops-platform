groups:
  - name: blueprint-app-alerts
    interval: 30s
    rules:
      - alert: HighErrorRate
        expr: |
          rate(http_requests_total{status=~"5.."}[5m]) /
          rate(http_requests_total[5m]) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High error rate ({{ $value | humanizePercentage }})"
          description: "Error rate is above 5% for the last 5 minutes."

      - alert: HighLatencyP99
        expr: |
          histogram_quantile(0.99, rate(http_request_duration_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High P99 latency ({{ $value }}s)"
          description: "P99 latency is above 2 seconds for the last 5 minutes."

      - alert: PodCrashLooping
        expr: |
          rate(kube_pod_container_status_restarts_total[15m]) * 60 > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Pod {{ $labels.pod }} is crash looping"
          description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} has restarted more than 5 times in 15 minutes."

      - alert: HighCPUUsage
        expr: |
          sum(rate(container_cpu_usage_seconds_total{namespace=~"blueprint-.*"}[5m])) by (pod, namespace) /
          sum(kube_pod_container_resource_requests_cpu_cores{namespace=~"blueprint-.*"}) by (pod, namespace) > 0.9
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage ({{ $value | humanizePercentage }})"
          description: "Pod {{ $labels.pod }} is using more than 90% of requested CPU."

      - alert: HighMemoryUsage
        expr: |
          sum(container_memory_usage_bytes{namespace=~"blueprint-.*"}) by (pod, namespace) /
          sum(kube_pod_container_resource_requests_memory_bytes{namespace=~"blueprint-.*"}) by (pod, namespace) > 0.9
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage ({{ $value | humanizePercentage }})"
          description: "Pod {{ $labels.pod }} is using more than 90% of requested memory."

      - alert: PodNotReady
        expr: |
          kube_pod_status_ready{condition="false", namespace=~"blueprint-.*"} > 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Pod {{ $labels.pod }} is not ready"
          description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} has been not ready for 10 minutes."

      - alert: DeploymentReplicasMismatch
        expr: |
          kube_deployment_spec_replicas{namespace=~"blueprint-.*"} !=
          kube_deployment_status_replicas_available{namespace=~"blueprint-.*"}
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Deployment {{ $labels.deployment }} replica mismatch"
          description: "Deployment {{ $labels.deployment }} has {{ $value }} unavailable replicas."

      - alert: CertExpiringSoon
        expr: |
          (nginx_ingress_controller_ssl_expire_time_seconds - time()) < 2592000
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "TLS certificate expiring soon"
          description: "Certificate for {{ $labels.host }} expires in less than 30 days."
