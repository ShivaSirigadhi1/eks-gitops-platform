receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  prometheus:
    config:
      scrape_configs:
        - job_name: 'otel-collector'
          static_configs:
            - targets: ['localhost:8888']

processors:
  batch:
    timeout: 10s
    send_batch_size: 1000
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
  k8sattributes:
    auth_type: "serviceAccount"
    passthrough: false
    extract:
      metadata:
        - k8s.pod.name
        - k8s.namespace.name
        - k8s.deployment.name
        - k8s.cluster.name
    filter:
      metadata:
        - k8s.pod.name
        - k8s.namespace.name

exporters:
  otlp:
    endpoint: tempo.monitoring.svc:4317
    tls:
      insecure: true
  otlphttp:
    endpoint: http://tempo.monitoring.svc:4318/v1/traces
  loki:
    endpoint: http://loki.monitoring.svc:3100/loki/api/v1/push
  prometheus:
    endpoint: 0.0.0.0:8889
  logging:
    loglevel: debug

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch, k8sattributes, memory_limiter]
      exporters: [otlp]
    metrics:
      receivers: [otlp, prometheus]
      processors: [batch, k8sattributes, memory_limiter]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [batch, k8sattributes, memory_limiter]
      exporters: [loki]
