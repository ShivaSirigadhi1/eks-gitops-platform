apiVersion: v1
kind: Namespace
metadata:
  name: vault
---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: vault
  namespace: vault
spec:
  repo: https://helm.releases.hashicorp.com
  chart: vault
  targetNamespace: vault
  version: "0.27.0"
  valuesContent: |
    server:
      dev:
        enabled: true
      devRootToken: "root"
    injector:
      enabled: true
    csi:
      enabled: true
